<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  /* ── Default theme vars (purple-galaxy) ── */
  :root {
    --primary:#7c3aed; --primary-light:#a78bfa; --primary-dark:#5b21b6;
    --accent:#f59e0b;
    --bg:#0f0a1e; --card:#1a1133; --card2:#231845;
    --text:#f3f0ff; --muted:#9d8ec4; --border:#3d2e6b;
    --success:#10b981; --error:#ef4444;
    --glow1:rgba(124,58,237,.15); --glow2:rgba(245,158,11,.08);
    --btn-grad:linear-gradient(135deg,#7c3aed,#9333ea);
    --btn-shadow:rgba(124,58,237,.4);
    --logo-grad:linear-gradient(135deg,#7c3aed,#f59e0b);
    --selected-bg:rgba(124,58,237,.2);
  }

  /* ══ THEMES ═══════════════════════════════════════════ */
  body.theme-neon-cyber {
    --primary:#00ffcc; --primary-light:#5fffd6; --primary-dark:#00b894;
    --accent:#ff0088; --bg:#000810; --card:#001018; --card2:#001622;
    --text:#e0fff8; --muted:#4db89a; --border:#003d35;
    --glow1:rgba(0,255,200,.12); --glow2:rgba(255,0,136,.06);
    --btn-grad:linear-gradient(135deg,#00b894,#00ffcc); --btn-shadow:rgba(0,255,200,.35);
    --logo-grad:linear-gradient(135deg,#00ffcc,#ff0088); --selected-bg:rgba(0,255,200,.15);
  }
  body.theme-fire-gold {
    --primary:#f97316; --primary-light:#fb923c; --primary-dark:#c2410c;
    --accent:#fbbf24; --bg:#140800; --card:#201005; --card2:#2a1508;
    --text:#fff7ed; --muted:#c87941; --border:#5a2500;
    --glow1:rgba(249,115,22,.15); --glow2:rgba(251,191,36,.08);
    --btn-grad:linear-gradient(135deg,#c2410c,#f97316); --btn-shadow:rgba(249,115,22,.4);
    --logo-grad:linear-gradient(135deg,#f97316,#fbbf24); --selected-bg:rgba(249,115,22,.2);
  }
  body.theme-ocean-deep {
    --primary:#0ea5e9; --primary-light:#38bdf8; --primary-dark:#0369a1;
    --accent:#06b6d4; --bg:#000f1e; --card:#001528; --card2:#001e35;
    --text:#e0f2fe; --muted:#5ba8d4; --border:#0c4a6e;
    --glow1:rgba(14,165,233,.15); --glow2:rgba(6,182,212,.08);
    --btn-grad:linear-gradient(135deg,#0369a1,#0ea5e9); --btn-shadow:rgba(14,165,233,.4);
    --logo-grad:linear-gradient(135deg,#0ea5e9,#06b6d4); --selected-bg:rgba(14,165,233,.2);
  }
  body.theme-sakura {
    --primary:#f472b6; --primary-light:#f9a8d4; --primary-dark:#be185d;
    --accent:#fb7185; --bg:#19050f; --card:#25081a; --card2:#300c22;
    --text:#fdf2f8; --muted:#c46a94; --border:#6d1a3e;
    --glow1:rgba(244,114,182,.15); --glow2:rgba(251,113,133,.08);
    --btn-grad:linear-gradient(135deg,#be185d,#f472b6); --btn-shadow:rgba(244,114,182,.4);
    --logo-grad:linear-gradient(135deg,#f472b6,#fb7185); --selected-bg:rgba(244,114,182,.2);
  }
  body.theme-midnight-gold {
    --primary:#d97706; --primary-light:#fbbf24; --primary-dark:#92400e;
    --accent:#fbbf24; --bg:#050400; --card:#0f0c00; --card2:#181500;
    --text:#fffbeb; --muted:#a07030; --border:#5c4400;
    --glow1:rgba(217,119,6,.15); --glow2:rgba(251,191,36,.06);
    --btn-grad:linear-gradient(135deg,#92400e,#d97706); --btn-shadow:rgba(217,119,6,.4);
    --logo-grad:linear-gradient(135deg,#d97706,#fbbf24); --selected-bg:rgba(217,119,6,.2);
  }
  body.theme-arctic-ice {
    --primary:#7dd3fc; --primary-light:#bae6fd; --primary-dark:#0ea5e9;
    --accent:#e0f2fe; --bg:#050f19; --card:#0a1828; --card2:#0d2035;
    --text:#f0f9ff; --muted:#4a8fb3; --border:#0c4e6e;
    --glow1:rgba(125,211,252,.1); --glow2:rgba(224,242,254,.05);
    --btn-grad:linear-gradient(135deg,#0ea5e9,#7dd3fc); --btn-shadow:rgba(125,211,252,.35);
    --logo-grad:linear-gradient(135deg,#7dd3fc,#e0f2fe); --selected-bg:rgba(125,211,252,.15);
  }
  body.theme-forest-night {
    --primary:#22c55e; --primary-light:#4ade80; --primary-dark:#15803d;
    --accent:#86efac; --bg:#020c05; --card:#051610; --card2:#081e14;
    --text:#f0fdf4; --muted:#4a9965; --border:#144d25;
    --glow1:rgba(34,197,94,.12); --glow2:rgba(134,239,172,.06);
    --btn-grad:linear-gradient(135deg,#15803d,#22c55e); --btn-shadow:rgba(34,197,94,.4);
    --logo-grad:linear-gradient(135deg,#22c55e,#86efac); --selected-bg:rgba(34,197,94,.2);
  }
  body.theme-sunset-vibe {
    --primary:#f43f5e; --primary-light:#fb7185; --primary-dark:#be123c;
    --accent:#fb923c; --bg:#14050f; --card:#200810; --card2:#2a0c18;
    --text:#fff1f2; --muted:#c45070; --border:#6d1530;
    --glow1:rgba(244,63,94,.15); --glow2:rgba(251,146,60,.08);
    --btn-grad:linear-gradient(135deg,#be123c,#f43f5e); --btn-shadow:rgba(244,63,94,.4);
    --logo-grad:linear-gradient(135deg,#f43f5e,#fb923c); --selected-bg:rgba(244,63,94,.2);
  }
  body.theme-monochrome {
    --primary:#d4d4d4; --primary-light:#e5e5e5; --primary-dark:#737373;
    --accent:#a3a3a3; --bg:#080808; --card:#141414; --card2:#1c1c1c;
    --text:#fafafa; --muted:#737373; --border:#333333;
    --glow1:rgba(229,229,229,.06); --glow2:rgba(163,163,163,.04);
    --btn-grad:linear-gradient(135deg,#525252,#d4d4d4); --btn-shadow:rgba(212,212,212,.3);
    --logo-grad:linear-gradient(135deg,#737373,#e5e5e5); --selected-bg:rgba(212,212,212,.15);
  }
  body.theme-royal-purple {
    --primary:#c084fc; --primary-light:#d8b4fe; --primary-dark:#7e22ce;
    --accent:#e879f9; --bg:#12052a; --card:#1e0840; --card2:#280b52;
    --text:#faf5ff; --muted:#9a6fc4; --border:#4a1878;
    --glow1:rgba(192,132,252,.15); --glow2:rgba(232,121,249,.08);
    --btn-grad:linear-gradient(135deg,#7e22ce,#c084fc); --btn-shadow:rgba(192,132,252,.45);
    --logo-grad:linear-gradient(135deg,#c084fc,#e879f9); --selected-bg:rgba(192,132,252,.2);
  }

  /* ══ STYLES ═══════════════════════════════════════════ */
  body {
    font-family:'Kanit',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px;
    transition: background .4s, color .3s;
  }

  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, var(--glow1) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, var(--glow2) 0%, transparent 60%);
  }

  .container { width:100%; max-width:520px; position:relative; z-index:1; }

  header { text-align:center; padding:32px 0 24px; }

  .logo {
    width:72px; height:72px;
    background: var(--logo-grad);
    border-radius:24px; display:inline-flex; align-items:center; justify-content:center;
    font-size:32px; margin-bottom:12px;
    box-shadow: 0 8px 32px var(--btn-shadow);
    transition: box-shadow .4s;
  }

  h1 { font-size:28px; font-weight:700; letter-spacing:.5px; }
  h1 span { color:var(--primary-light); }
  .subtitle { color:var(--muted); font-size:14px; margin-top:4px; }

  .card {
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:28px; margin-bottom:16px; box-shadow:0 4px 24px rgba(0,0,0,.3);
    transition: background .4s, border-color .4s;
  }

  .section-title {
    font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:12px;
  }

  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500; }

  input, textarea, select {
    width:100%; background:var(--card2); border:1px solid var(--border);
    border-radius:12px; color:var(--text); font-family:'Kanit',sans-serif;
    font-size:15px; padding:12px 16px; outline:none;
    transition: border-color .2s, box-shadow .2s, background .4s;
  }

  input:focus, textarea:focus, select:focus {
    border-color:var(--primary-light);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
  }

  textarea { resize:vertical; min-height:90px; }
  .input-group { margin-bottom:16px; }

  .amount-row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end; }

  .currency-badge {
    background:var(--primary); color:white; border-radius:10px;
    padding:12px 18px; font-weight:600; font-size:15px; white-space:nowrap;
    transition: background .4s;
  }

  .quick-amounts { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }

  .quick-btn {
    background:var(--card2); border:1px solid var(--border); border-radius:8px;
    color:var(--muted); cursor:pointer; font-family:'Kanit',sans-serif;
    font-size:13px; padding:6px 14px; transition:all .2s;
  }
  .quick-btn:hover, .quick-btn.active {
    background:var(--primary); border-color:var(--primary); color:white;
  }

  .emotion-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }

  .emotion-btn {
    background:var(--card2); border:2px solid var(--border); border-radius:12px;
    color:var(--muted); cursor:pointer; font-family:'Kanit',sans-serif;
    font-size:13px; padding:10px 8px; text-align:center; transition:all .2s;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .emotion-btn .emoji { font-size:22px; }
  .emotion-btn:hover { border-color:var(--primary-light); color:var(--primary-light); }
  .emotion-btn.selected {
    background:var(--selected-bg);
    border-color:var(--primary-light);
    color:var(--primary-light);
  }

  /* ── TTS Provider Selector ── */
  .tts-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .tts-btn {
    background:var(--card2); border:2px solid var(--border); border-radius:14px;
    color:var(--muted); cursor:pointer; font-family:'Kanit',sans-serif;
    padding:14px 10px; text-align:center; transition:all .25s; position:relative;
  }
  .tts-btn:hover { border-color:var(--primary-light); color:var(--text); }
  .tts-btn.selected {
    background:var(--selected-bg);
    border-color:var(--primary-light);
    color:var(--primary-light);
    box-shadow: 0 0 16px color-mix(in srgb, var(--primary) 30%, transparent);
  }
  .tts-btn .tts-icon { font-size:26px; display:block; margin-bottom:8px; }
  .tts-btn .tts-name { font-size:14px; font-weight:700; }
  .tts-btn .tts-desc { font-size:11px; opacity:.65; margin-top:3px; }
  .tts-btn .tts-check {
    position:absolute; top:8px; right:8px;
    background:var(--primary-light); color:#000;
    border-radius:50%; width:18px; height:18px;
    display:none; align-items:center; justify-content:center;
    font-size:10px; font-weight:700;
  }
  .tts-btn.selected .tts-check { display:flex; }

  .tts-note {
    font-size:11px; color:var(--muted); text-align:center; margin-top:10px;
    padding:6px 10px; background:color-mix(in srgb, var(--primary) 8%, transparent);
    border-radius:8px; border:1px solid color-mix(in srgb, var(--primary) 20%, transparent);
  }

  /* card appear animation */
  @keyframes cardIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .card-appear { animation: cardIn .3s cubic-bezier(.34,1.2,.64,1) both; }

  .char-count { text-align:right; font-size:11px; color:var(--muted); margin-top:4px; }

  .submit-btn {
    width:100%; background:var(--btn-grad); border:none; border-radius:14px;
    color:white; cursor:pointer; font-family:'Kanit',sans-serif;
    font-size:17px; font-weight:600; padding:16px; transition:all .2s;
    box-shadow: 0 4px 20px var(--btn-shadow); position:relative; overflow:hidden;
  }
  .submit-btn:hover { transform:translateY(-2px); filter:brightness(1.1); }
  .submit-btn:active { transform:translateY(0); }
  .submit-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .submit-btn .spinner {
    display:none; width:20px; height:20px;
    border:3px solid rgba(255,255,255,.3); border-top-color:white;
    border-radius:50%; animation:spin .7s linear infinite; margin:0 auto;
  }
  .submit-btn.loading .btn-text { display:none; }
  .submit-btn.loading .spinner { display:block; }
  @keyframes spin { to{transform:rotate(360deg)} }

  .toast {
    position:fixed; top:24px; left:50%;
    transform:translateX(-50%) translateY(-80px);
    background:var(--success); color:white; border-radius:12px;
    padding:14px 24px; font-weight:600; font-size:15px; z-index:9999;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 8px 24px rgba(0,0,0,.3); text-align:center; min-width:260px;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.error { background:var(--error); }

  .min-note { text-align:center; font-size:12px; color:var(--muted); margin-top:8px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:24px 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">🎁</div>
    <h1 id="streamTitle">Stream <span>Donate</span></h1>
    <p class="subtitle">ส่งความรักให้สตรีมเมอร์คุณชื่นชอบ</p>
  </header>

  <!-- Donor info -->
  <div class="card">
    <div class="section-title">ข้อมูลผู้บริจาค</div>
    <div class="input-group">
      <label>ชื่อของคุณ *</label>
      <input type="text" id="donorName" placeholder="ใส่ชื่อของคุณ" maxlength="50">
    </div>
    <div class="input-group">
      <label>จำนวนเงิน *</label>
      <div class="amount-row">
        <input type="number" id="donateAmount" placeholder="0" min="1" oninput="onAmountInput()">
        <div class="currency-badge" id="currencyBadge">THB</div>
      </div>
      <div class="quick-amounts" id="quickAmounts">
        <button class="quick-btn" onclick="setAmount(20)">฿20</button>
        <button class="quick-btn" onclick="setAmount(50)">฿50</button>
        <button class="quick-btn" onclick="setAmount(100)">฿100</button>
        <button class="quick-btn" onclick="setAmount(200)">฿200</button>
        <button class="quick-btn" onclick="setAmount(500)">฿500</button>
        <button class="quick-btn" onclick="setAmount(1000)">฿1,000</button>
      </div>
    </div>
  </div>

  <!-- Message & emotion -->
  <div class="card">
    <div class="section-title">ข้อความ & อารมณ์</div>
    <div class="input-group">
      <label>ข้อความ (จะถูกอ่านออกเสียง)</label>
      <textarea id="donateMessage" placeholder="พิมพ์ข้อความที่ต้องการให้อ่าน..." maxlength="300"
        oninput="updateCharCount()"></textarea>
      <div class="char-count"><span id="charCount">0</span>/300</div>
    </div>
    <div class="input-group">
      <label>เลือกอารมณ์ในการอ่าน</label>
      <div class="emotion-grid">
        <button class="emotion-btn selected" data-emotion="neutral" onclick="selectEmotion(this)">
          <span class="emoji">😐</span>ปกติ
        </button>
        <button class="emotion-btn" data-emotion="happy" onclick="selectEmotion(this)">
          <span class="emoji">😊</span>มีความสุข
        </button>
        <button class="emotion-btn" data-emotion="excited" onclick="selectEmotion(this)">
          <span class="emoji">🤩</span>ตื่นเต้น
        </button>
        <button class="emotion-btn" data-emotion="sad" onclick="selectEmotion(this)">
          <span class="emoji">😢</span>เศร้า
        </button>
        <button class="emotion-btn" data-emotion="angry" onclick="selectEmotion(this)">
          <span class="emoji">😠</span>โกรธ
        </button>
        <button class="emotion-btn" data-emotion="whispering" onclick="selectEmotion(this)">
          <span class="emoji">🤫</span>กระซิบ
        </button>
      </div>
    </div>
  </div>

  <!-- TTS Provider selector (shown only when both providers are configured) -->
  <div class="card card-appear" id="tts-picker-card" style="display:none">
    <div class="section-title">🎙️ เลือกเสียงที่ใช้อ่าน</div>
    <div class="tts-grid">
      <button class="tts-btn" data-provider="elevenlabs" id="tts-btn-eleven" onclick="selectTts(this)">
        <div class="tts-check">✓</div>
        <span class="tts-icon">🎧</span>
        <div class="tts-name">ElevenLabs</div>
        <div class="tts-desc">คุณภาพสูง อ่านชัดเจน</div>
      </button>
      <button class="tts-btn" data-provider="google" id="tts-btn-google" onclick="selectTts(this)">
        <div class="tts-check">✓</div>
        <span class="tts-icon">🔵</span>
        <div class="tts-name">Google TTS</div>
        <div class="tts-desc">เร็ว รองรับหลายภาษา</div>
      </button>
    </div>
    <p class="tts-note" id="tts-note">✨ คุณสามารถเลือกเสียงที่ต้องการได้</p>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitDonate()">
    <span class="btn-text">💜 ส่งการบริจาค</span>
    <div class="spinner"></div>
  </button>
  <p class="min-note" id="minNote">ยอดบริจาคขั้นต่ำ 20 THB</p>
  <footer id="footerText">Powered by ElevenLabs TTS · Stream Donate System</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  let selectedEmotion    = 'neutral';
  let selectedTtsProvider = null; // null = use server default
  let cfgMinDonate       = 20;
  let cfgCurrency        = 'THB';
  let bothProvidersAvail = false;
  let defaultProvider    = 'elevenlabs';

  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      const cfg = await r.json();
      // theme
      document.body.className = 'theme-' + (cfg.theme || 'purple-galaxy');
      // content
      document.getElementById('streamTitle').innerHTML = cfg.streamTitle
        ? cfg.streamTitle.replace(/(\S+)$/, '<span>$1</span>')
        : 'Stream <span>Donate</span>';
      cfgCurrency = cfg.currency || 'THB';
      cfgMinDonate = cfg.minDonate || 20;
      document.getElementById('currencyBadge').textContent = cfgCurrency;
      document.getElementById('minNote').textContent =
        `ยอดบริจาคขั้นต่ำ ${cfgMinDonate} ${cfgCurrency}`;
      defaultProvider = cfg.ttsProvider || 'elevenlabs';

      // TTS provider selector — show only if BOTH providers are configured
      bothProvidersAvail = !!(cfg.elevenLabsAvailable && cfg.googleTtsAvailable);
      const pickerCard = document.getElementById('tts-picker-card');
      if (bothProvidersAvail) {
        pickerCard.style.display = 'block';
        // pre-select the server's default provider
        const defaultBtn = document.querySelector(`[data-provider="${defaultProvider}"]`);
        if (defaultBtn) selectTts(defaultBtn, true);
      } else {
        pickerCard.style.display = 'none';
        selectedTtsProvider = null; // server decides
      }

      const providerName = defaultProvider === 'google' ? 'Google TTS' : 'ElevenLabs';
      document.getElementById('footerText').textContent =
        `Powered by ${providerName} TTS · Stream Donate System`;
    } catch(e) {}
  }

  function setAmount(v) {
    document.getElementById('donateAmount').value = v;
    document.querySelectorAll('.quick-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.textContent.replace(/[฿,]/g,'')) === v);
    });
    onAmountInput();
  }

  function onAmountInput() {
    const amt = Number(document.getElementById('donateAmount').value);
    // Quick-btn sync
    document.querySelectorAll('.quick-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.textContent.replace(/[฿,]/g,'')) === amt);
    });
  }

  function selectEmotion(el) {
    document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedEmotion = el.dataset.emotion;
  }

  function selectTts(el, silent = false) {
    document.querySelectorAll('.tts-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedTtsProvider = el.dataset.provider;
    const note = document.getElementById('tts-note');
    if (selectedTtsProvider === 'elevenlabs') {
      note.textContent = '🎧 ElevenLabs — คุณภาพเสียงสูงสุด อ่านออกอารมณ์ได้ชัด';
    } else {
      note.textContent = '🔵 Google TTS — เร็ว ประหยัด รองรับหลายภาษา';
    }
  }

  function updateCharCount() {
    document.getElementById('charCount').textContent =
      document.getElementById('donateMessage').value.length;
  }

  function showToast(msg, isError=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  async function submitDonate() {
    const name    = document.getElementById('donorName').value.trim();
    const amount  = document.getElementById('donateAmount').value;
    const message = document.getElementById('donateMessage').value.trim();
    const btn     = document.getElementById('submitBtn');

    if (!name)                     return showToast('⚠️ กรุณาใส่ชื่อของคุณ', true);
    if (!amount || Number(amount) <= 0) return showToast('⚠️ กรุณาใส่จำนวนเงิน', true);

    btn.disabled = true; btn.classList.add('loading');
    try {
      const body = {
        name,
        amount:   Number(amount),
        message,
        emotion:  selectedEmotion,
      };
      // Include TTS provider choice if both are available
      if (bothProvidersAvail && selectedTtsProvider) {
        body.ttsProvider = selectedTtsProvider;
      }

      const res  = await fetch('/api/donate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) return showToast('❌ ' + (data.error || 'เกิดข้อผิดพลาด'), true);

      showToast('🎉 ขอบคุณสำหรับการบริจาค!');
      document.getElementById('donorName').value    = '';
      document.getElementById('donateAmount').value = '';
      document.getElementById('donateMessage').value = '';
      updateCharCount();
      document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
      selectEmotion(document.querySelector('[data-emotion="neutral"]'));
      // Reset TTS to default
      if (bothProvidersAvail) {
        const defaultBtn = document.querySelector(`[data-provider="${defaultProvider}"]`);
        if (defaultBtn) selectTts(defaultBtn, true);
      }
    } catch(e) {
      showToast('❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์', true);
    } finally {
      btn.disabled = false; btn.classList.remove('loading');
    }
  }

  loadConfig();
</script>
</body>
</html>
