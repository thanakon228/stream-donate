<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bungee&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  /* ── Default CSS vars (purple-galaxy) ── */
  :root {
    --t-bg1: rgba(15,10,30,.97);
    --t-bg2: rgba(35,24,69,.97);
    --t-bar1: #7c3aed; --t-bar2: #f59e0b;
    --t-badge: linear-gradient(135deg,#7c3aed,#a855f7);
    --t-text: #f3f0ff;
    --t-msg-color: #c4b5fd;
    --t-msg-border: rgba(124,58,237,.5);
    --t-msg-bg: rgba(124,58,237,.1);
    --t-name-glow: rgba(124,58,237,.6);
    --t-speak: #a78bfa;
    --t-neutral-glow: rgba(124,58,237,.4);
  }

  /* ══ THEMES ══════════════════════════════════════════════ */
  body.theme-neon-cyber {
    --t-bg1: rgba(0,8,18,.97); --t-bg2: rgba(0,22,35,.97);
    --t-bar1: #00ffcc; --t-bar2: #ff0088;
    --t-badge: linear-gradient(135deg,#007a66,#00ffcc);
    --t-msg-color: #00ffcc; --t-msg-border: rgba(0,255,200,.5); --t-msg-bg: rgba(0,255,200,.06);
    --t-name-glow: rgba(0,255,200,.7); --t-speak: #00ffcc; --t-neutral-glow: rgba(0,255,200,.4);
  }
  body.theme-fire-gold {
    --t-bg1: rgba(20,8,0,.97); --t-bg2: rgba(40,15,5,.97);
    --t-bar1: #f97316; --t-bar2: #fbbf24;
    --t-badge: linear-gradient(135deg,#c2410c,#f97316);
    --t-msg-color: #fed7aa; --t-msg-border: rgba(249,115,22,.5); --t-msg-bg: rgba(249,115,22,.08);
    --t-name-glow: rgba(249,115,22,.7); --t-speak: #fb923c; --t-neutral-glow: rgba(249,115,22,.4);
  }
  body.theme-ocean-deep {
    --t-bg1: rgba(0,15,30,.97); --t-bg2: rgba(0,30,50,.97);
    --t-bar1: #0ea5e9; --t-bar2: #06b6d4;
    --t-badge: linear-gradient(135deg,#0369a1,#0ea5e9);
    --t-msg-color: #7dd3fc; --t-msg-border: rgba(14,165,233,.5); --t-msg-bg: rgba(14,165,233,.08);
    --t-name-glow: rgba(14,165,233,.7); --t-speak: #38bdf8; --t-neutral-glow: rgba(14,165,233,.4);
  }
  body.theme-sakura {
    --t-bg1: rgba(25,5,15,.97); --t-bg2: rgba(45,10,30,.97);
    --t-bar1: #f472b6; --t-bar2: #fb7185;
    --t-badge: linear-gradient(135deg,#be185d,#f472b6);
    --t-msg-color: #fbcfe8; --t-msg-border: rgba(244,114,182,.5); --t-msg-bg: rgba(244,114,182,.08);
    --t-name-glow: rgba(244,114,182,.7); --t-speak: #f9a8d4; --t-neutral-glow: rgba(244,114,182,.4);
  }
  body.theme-midnight-gold {
    --t-bg1: rgba(5,4,0,.97); --t-bg2: rgba(15,12,0,.97);
    --t-bar1: #d97706; --t-bar2: #fbbf24;
    --t-badge: linear-gradient(135deg,#92400e,#d97706);
    --t-msg-color: #fde68a; --t-msg-border: rgba(217,119,6,.5); --t-msg-bg: rgba(217,119,6,.08);
    --t-name-glow: rgba(251,191,36,.7); --t-speak: #fbbf24; --t-neutral-glow: rgba(217,119,6,.4);
  }
  body.theme-arctic-ice {
    --t-bg1: rgba(5,15,25,.97); --t-bg2: rgba(10,25,40,.97);
    --t-bar1: #e0f2fe; --t-bar2: #7dd3fc;
    --t-badge: linear-gradient(135deg,#0369a1,#e0f2fe);
    --t-msg-color: #e0f2fe; --t-msg-border: rgba(224,242,254,.4); --t-msg-bg: rgba(224,242,254,.06);
    --t-name-glow: rgba(224,242,254,.8); --t-speak: #bae6fd; --t-neutral-glow: rgba(186,230,253,.4);
  }
  body.theme-forest-night {
    --t-bg1: rgba(2,12,5,.97); --t-bg2: rgba(5,22,10,.97);
    --t-bar1: #22c55e; --t-bar2: #86efac;
    --t-badge: linear-gradient(135deg,#15803d,#22c55e);
    --t-msg-color: #bbf7d0; --t-msg-border: rgba(34,197,94,.5); --t-msg-bg: rgba(34,197,94,.08);
    --t-name-glow: rgba(34,197,94,.7); --t-speak: #4ade80; --t-neutral-glow: rgba(34,197,94,.4);
  }
  body.theme-sunset-vibe {
    --t-bg1: rgba(20,5,15,.97); --t-bg2: rgba(35,10,25,.97);
    --t-bar1: #f43f5e; --t-bar2: #fb923c;
    --t-badge: linear-gradient(135deg,#be123c,#f43f5e);
    --t-msg-color: #fda4af; --t-msg-border: rgba(244,63,94,.5); --t-msg-bg: rgba(244,63,94,.08);
    --t-name-glow: rgba(244,63,94,.7); --t-speak: #fb7185; --t-neutral-glow: rgba(244,63,94,.4);
  }
  body.theme-monochrome {
    --t-bg1: rgba(8,8,8,.97); --t-bg2: rgba(18,18,18,.97);
    --t-bar1: #e5e5e5; --t-bar2: #737373;
    --t-badge: linear-gradient(135deg,#404040,#e5e5e5);
    --t-msg-color: #d4d4d4; --t-msg-border: rgba(229,229,229,.4); --t-msg-bg: rgba(229,229,229,.06);
    --t-name-glow: rgba(255,255,255,.5); --t-speak: #a3a3a3; --t-neutral-glow: rgba(229,229,229,.3);
  }
  body.theme-royal-purple {
    --t-bg1: rgba(18,5,35,.97); --t-bg2: rgba(35,10,65,.97);
    --t-bar1: #c084fc; --t-bar2: #e879f9;
    --t-badge: linear-gradient(135deg,#7e22ce,#c084fc);
    --t-msg-color: #e9d5ff; --t-msg-border: rgba(192,132,252,.5); --t-msg-bg: rgba(192,132,252,.1);
    --t-name-glow: rgba(192,132,252,.8); --t-speak: #c084fc; --t-neutral-glow: rgba(192,132,252,.5);
  }

  /* ══ LAYOUT ═══════════════════════════════════════════════ */
  body { background:transparent; font-family:'Kanit',sans-serif; overflow:hidden; width:100vw; height:100vh; }

  #alert-container {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    width:580px; pointer-events:none; z-index:100;
  }

  .alert-box {
    background: linear-gradient(135deg, var(--t-bg1) 0%, var(--t-bg2) 100%);
    border-radius:20px; padding:0; overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 30px var(--t-neutral-glow), inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0; position:relative;
  }

  /* ══ ENTRANCE ANIMATIONS ══════════════════════════════════ */

  /* 1. Slide Up (from bottom) */
  @keyframes anim-slideUp {
    from { opacity:0; transform:translateY(80px) scale(.88); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }
  /* 2. Drop In (from top) */
  @keyframes anim-dropIn {
    from { opacity:0; transform:translateY(-80px) scale(.88); }
    to   { opacity:1; transform:translateY(0)     scale(1);   }
  }
  /* 3. Zoom In (from center) */
  @keyframes anim-zoomIn {
    from { opacity:0; transform:scale(.5); }
    to   { opacity:1; transform:scale(1);  }
  }
  /* 4. Flip X (lid opens) */
  @keyframes anim-flipX {
    from { opacity:0; transform:perspective(700px) rotateX(-80deg) scale(.9); }
    to   { opacity:1; transform:perspective(700px) rotateX(0deg)   scale(1);  }
  }
  /* 5. Slide from Left */
  @keyframes anim-slideLeft {
    from { opacity:0; transform:translateX(-120%) scale(.95); }
    to   { opacity:1; transform:translateX(0)     scale(1);   }
  }
  /* 6. Slide from Right */
  @keyframes anim-slideRight {
    from { opacity:0; transform:translateX(120%) scale(.95); }
    to   { opacity:1; transform:translateX(0)    scale(1);   }
  }
  /* 7. Bounce In */
  @keyframes anim-bounceIn {
    0%   { opacity:0; transform:scale(.4) translateY(40px);  }
    55%  { opacity:1; transform:scale(1.12) translateY(-8px); }
    75%  { transform:scale(.96) translateY(4px);  }
    90%  { transform:scale(1.03) translateY(-2px);}
    100% { transform:scale(1)   translateY(0);    }
  }
  /* 8. Swing In (rotate + rise) */
  @keyframes anim-swingIn {
    from { opacity:0; transform:rotate(-12deg) translateY(50px) scale(.85); }
    60%  { transform:rotate(4deg)  translateY(-10px) scale(1.02); }
    80%  { transform:rotate(-2deg) translateY(4px)   scale(.99);  }
    to   { opacity:1; transform:rotate(0deg)  translateY(0)      scale(1);   }
  }

  /* EXIT ANIMATIONS */
  @keyframes anim-exitDown   { to { opacity:0; transform:translateY(70px)  scale(.9); } }
  @keyframes anim-exitUp     { to { opacity:0; transform:translateY(-70px) scale(.9); } }
  @keyframes anim-exitZoom   { to { opacity:0; transform:scale(1.15); } }
  @keyframes anim-exitFade   { to { opacity:0; transform:scale(.95); } }
  @keyframes anim-exitLeft   { to { opacity:0; transform:translateX(-110%) scale(.95); } }
  @keyframes anim-exitRight  { to { opacity:0; transform:translateX(110%)  scale(.95); } }
  @keyframes anim-exitShrink { to { opacity:0; transform:scale(.3) translateY(30px); } }
  @keyframes anim-exitSwing  { to { opacity:0; transform:rotate(8deg) translateY(60px) scale(.85); } }

  /* ── Apply by class ── */
  .alert-box.enter-slideUp  { animation: anim-slideUp  .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  .alert-box.enter-dropIn   { animation: anim-dropIn   .5s cubic-bezier(.34,1.56,.64,1) forwards; }
  .alert-box.enter-zoomIn   { animation: anim-zoomIn   .45s cubic-bezier(.34,1.56,.64,1) forwards; }
  .alert-box.enter-flipX    { animation: anim-flipX    .5s ease-out forwards; }
  .alert-box.enter-slideLeft { animation: anim-slideLeft .42s cubic-bezier(.34,1.56,.64,1) forwards; }
  .alert-box.enter-slideRight{ animation: anim-slideRight .42s cubic-bezier(.34,1.56,.64,1) forwards; }
  .alert-box.enter-bounceIn { animation: anim-bounceIn .65s cubic-bezier(.2,1.2,.4,1) forwards; }
  .alert-box.enter-swingIn  { animation: anim-swingIn  .55s cubic-bezier(.34,1.3,.64,1) forwards; }

  .alert-box.exit-down   { animation: anim-exitDown   .38s ease-in forwards; }
  .alert-box.exit-up     { animation: anim-exitUp     .38s ease-in forwards; }
  .alert-box.exit-zoom   { animation: anim-exitZoom   .35s ease-in forwards; }
  .alert-box.exit-fade   { animation: anim-exitFade   .38s ease-in forwards; }
  .alert-box.exit-left   { animation: anim-exitLeft   .35s ease-in forwards; }
  .alert-box.exit-right  { animation: anim-exitRight  .35s ease-in forwards; }
  .alert-box.exit-shrink { animation: anim-exitShrink .38s ease-in forwards; }
  .alert-box.exit-swing  { animation: anim-exitSwing  .38s ease-in forwards; }


  /* accent bar */
  .alert-accent {
    height:4px;
    background: linear-gradient(90deg, var(--t-bar1), var(--t-bar2), var(--t-bar1));
    background-size:200% 100%;
    animation:shimmer 2s linear infinite;
  }
  @keyframes shimmer { to{background-position:200% 0} }

  .alert-body { padding:18px 22px 20px; display:flex; gap:16px; align-items:flex-start; }

  .alert-icon { font-size:44px; line-height:1; flex-shrink:0; animation:iconBounce .6s ease .4s both; }
  @keyframes iconBounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3) rotate(-10deg)} }

  .alert-content { flex:1; min-width:0; }
  .alert-header { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:6px; }

  .donor-name {
    font-size:20px; font-weight:800; color:var(--t-text);
    text-shadow: 0 0 20px var(--t-name-glow);
  }
  .donated-text { font-size:13px; color:rgba(255,255,255,.45); }

  .amount-badge {
    background: var(--t-badge);
    border-radius:20px; padding:3px 14px;
    font-size:18px; font-weight:700; color:white;
    box-shadow: 0 4px 12px rgba(0,0,0,.3); white-space:nowrap;
  }

  /* TTS provider pill */
  .tts-pill {
    margin-left:auto;
    font-size:10px; font-weight:600;
    padding:2px 8px; border-radius:20px;
    opacity:.65; white-space:nowrap;
    background:rgba(255,255,255,.1); color:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.15);
  }

  .alert-message {
    font-size:15px; color:var(--t-msg-color); line-height:1.5;
    background:var(--t-msg-bg); border-left:3px solid var(--t-msg-border);
    border-radius:0 8px 8px 0; padding:8px 12px; margin-top:8px;
  }
  .alert-progress { height:3px; background:rgba(255,255,255,.08); position:relative; overflow:hidden; }
  .alert-progress-bar { height:100%; background:var(--t-badge); width:100%; transform-origin:left; }

  .particles { position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:20px; }
  .particle { position:absolute; border-radius:50%; opacity:0; animation:floatUp 1.5s ease-out forwards; }
  @keyframes floatUp { 0%{opacity:.8;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(0)} }

  .speaking-indicator { display:flex; gap:3px; align-items:flex-end; height:18px; margin-left:4px; opacity:0; transition:opacity .3s; }
  .speaking-indicator.active { opacity:1; }
  .speaking-indicator span { width:3px; background:var(--t-speak); border-radius:2px; animation:wave 1s ease-in-out infinite; }
  .speaking-indicator span:nth-child(1){animation-delay:0s;height:6px}
  .speaking-indicator span:nth-child(2){animation-delay:.1s;height:12px}
  .speaking-indicator span:nth-child(3){animation-delay:.2s;height:16px}
  .speaking-indicator span:nth-child(4){animation-delay:.3s;height:10px}
  .speaking-indicator span:nth-child(5){animation-delay:.15s;height:8px}
  @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.8)} }

  #queue-badge {
    position:fixed; top:20px; right:20px;
    background:var(--t-badge); color:white; border-radius:10px;
    padding:6px 14px; font-size:13px; font-weight:600; display:none;
    backdrop-filter:blur(10px);
  }

  /* Animation name badge (bottom-left, fades after 2s) */
  #anim-badge {
    position:fixed; bottom:20px; left:20px;
    background:rgba(0,0,0,.5); color:rgba(255,255,255,.5);
    border-radius:8px; padding:4px 10px; font-size:11px;
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  #anim-badge.show { opacity:1; }

  #pause-indicator {
    display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fbbf24; border:1px solid #fbbf24;
    border-radius:12px; padding:6px 16px; font-size:13px; font-weight:700;
    gap:6px; align-items:center; backdrop-filter:blur(8px); z-index:200;
  }

  /* ══════════════════════════════════════════════════════════
     EPIC ALERT CONTAINER
  ══════════════════════════════════════════════════════════ */
  #epic-alert-container {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    width: 580px; height: 240px;
    display: none; align-items: center; justify-content: center;
    z-index: 100; overflow: visible;
  }
  #epicCanvas { position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5; }
  #epicContent { position:relative;z-index:10;width:100%; }

  /* ── shared epic keyframes ── */
  @keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes aOut{to{opacity:0;transform:scale(.95)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  /* ── 1. METEOR IMPACT ── */
  @keyframes meteorDrop{from{opacity:0;transform:translateY(-120px) rotate(-45deg) scale(.3)}to{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}}
  @keyframes impactRing{from{transform:scale(0);opacity:.8}to{transform:scale(4);opacity:0}}
  @keyframes crackle{0%,100%{text-shadow:0 0 10px #ff6b00,0 0 30px #ff3300}50%{text-shadow:0 0 20px #ffaa00,0 0 60px #ff6b00,0 0 100px #ff3300}}
  @keyframes scan2{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .mt-wrap{position:relative;width:580px;animation:aOut .4s ease 4.8s forwards}
  .mt-impact{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:rgba(255,120,0,.2);animation:impactRing .4s ease .1s forwards;z-index:0}
  .mt-impact2{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:rgba(255,200,0,.1);animation:impactRing .5s ease .2s forwards;z-index:0}
  .mt-box{position:relative;z-index:1;background:linear-gradient(135deg,rgba(20,8,0,.96),rgba(30,12,0,.94));border:2px solid rgba(255,120,0,.5);border-radius:8px;padding:18px 24px;box-shadow:0 0 60px rgba(255,80,0,.4),0 0 120px rgba(255,80,0,.15),inset 0 0 40px rgba(255,60,0,.06);overflow:hidden;animation:meteorDrop .5s cubic-bezier(.22,.61,.36,1) .05s both,shake .3s ease .55s}
  .mt-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff6b00,#ffcc00,#ff6b00,transparent);animation:scan2 .8s ease}
  .mt-box::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,100,0,.04),transparent 50%)}
  .mt-label{font-family:'Bungee',sans-serif;font-size:10px;letter-spacing:4px;color:rgba(255,150,0,.7);text-transform:uppercase;margin-bottom:4px;opacity:0;animation:fu .25s .6s forwards}
  .mt-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .mt-name{font-family:'Black Ops One',sans-serif;font-size:32px;color:#fff;line-height:1;text-shadow:0 0 20px rgba(255,120,0,.5);opacity:0;animation:fu .25s .72s forwards}
  .mt-vs{font-family:'Bungee',sans-serif;font-size:13px;color:rgba(255,255,255,.3);padding:0 4px}
  .mt-amt{font-family:'Black Ops One',sans-serif;font-size:42px;line-height:1;color:#ffaa00;opacity:0;animation:fu .25s .86s forwards,crackle 1.2s ease 1.2s infinite}
  .mt-msg{font-family:'Rajdhani',sans-serif;font-size:14px;color:rgba(255,200,150,.7);margin-top:6px;opacity:0;animation:fu .25s 1s forwards}
  .mt-icon{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:60px;filter:drop-shadow(0 0 20px rgba(255,100,0,.7));opacity:0;animation:fu .3s .5s forwards}

  /* ── 2. LIGHTNING GOD ── */
  @keyframes boltStrike{0%{clip-path:inset(0 0 100% 0);opacity:1}100%{clip-path:inset(0 0 0% 0);opacity:1}}
  @keyframes thunderFlash{0%{opacity:0}5%{opacity:.9}10%{opacity:.2}15%{opacity:.8}25%{opacity:0}100%{opacity:0}}
  @keyframes glowPulse{0%,100%{box-shadow:0 0 30px rgba(100,150,255,.4),0 0 60px rgba(80,100,255,.2)}50%{box-shadow:0 0 60px rgba(150,200,255,.7),0 0 120px rgba(100,150,255,.4)}}
  .lg-flash{position:absolute;inset:0;background:rgba(180,200,255,.4);z-index:15;animation:thunderFlash 1s ease .1s both;pointer-events:none;border-radius:10px}
  .lg-wrap{position:relative;width:580px;animation:aOut .4s ease 4.8s forwards}
  .lg-box{background:linear-gradient(135deg,rgba(5,10,30,.97),rgba(10,15,45,.94));border:2px solid rgba(100,150,255,.4);border-radius:8px;padding:16px 22px;position:relative;overflow:hidden;animation:glowPulse 2s ease 1s infinite}
  .lg-bolt-top{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#7090ff,#fff,#7090ff,transparent);animation:boltStrike .3s ease .15s both}
  .lg-bolt-bot{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#7090ff,#fff,#7090ff,transparent);animation:boltStrike .3s ease .2s both}
  .lg-bolt-l{position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,#7090ff,#fff,#7090ff,transparent);animation:boltStrike .3s ease .1s both}
  .lg-bolt-r{position:absolute;right:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,#7090ff,#fff,#7090ff,transparent);animation:boltStrike .3s ease .1s both}
  .lg-bg-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:150px;background:radial-gradient(ellipse,rgba(80,120,255,.15),transparent 70%);pointer-events:none}
  .lg-label{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:4px;color:rgba(130,160,255,.7);text-transform:uppercase;margin-bottom:4px;opacity:0;animation:fu .25s .5s forwards}
  .lg-content{display:flex;align-items:center;gap:16px}

<body>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ── Animation pairs [enterClass, exitClass, label] ────────
  const ANIM_PAIRS = [
    ['enter-slideUp',  'exit-down',   '⬆️ Slide Up'],
    ['enter-dropIn',   'exit-up',     '⬇️ Drop In'],
    ['enter-zoomIn',   'exit-shrink', '🔍 Zoom In'],
    ['enter-flipX',    'exit-fade',   '🃏 Flip X'],
    ['enter-slideLeft','exit-left',   '⬅️ Slide Left'],
    ['enter-slideRight','exit-right', '➡️ Slide Right'],
    ['enter-bounceIn', 'exit-down',   '🏀 Bounce'],
    ['enter-swingIn',  'exit-swing',  '🌀 Swing'],
  ];

  // ── Theme particle colors ─────────────────────────────────
  const THEME_PARTICLES = {
    'purple-galaxy': ['#a78bfa','#c4b5fd','#f59e0b'],
    'neon-cyber':    ['#00ffcc','#ff0088','#00ff88'],
    'fire-gold':     ['#f97316','#fbbf24','#ef4444'],
    'ocean-deep':    ['#0ea5e9','#06b6d4','#7dd3fc'],
    'sakura':        ['#f472b6','#fb7185','#fbcfe8'],
    'midnight-gold': ['#d97706','#fbbf24','#f59e0b'],
    'arctic-ice':    ['#e0f2fe','#7dd3fc','#bae6fd'],
    'forest-night':  ['#22c55e','#4ade80','#86efac'],
    'sunset-vibe':   ['#f43f5e','#fb923c','#fda4af'],
    'monochrome':    ['#e5e5e5','#a3a3a3','#737373'],
    'royal-purple':  ['#c084fc','#e879f9','#d8b4fe'],
  };

  let currentTheme     = 'purple-galaxy';
  let queue            = [];
  let isShowing        = false;
  let isPaused         = false;
  let alertDuration    = 8000;
  let lastAnimIdx      = -1;
  let epicAlertConfig  = { enabled: false, minAmount: 50, style: 'random' };

  // ── Audio helpers ────────────────────────────────────────
  // Detect MIME type from base64 header:
  //   WAV starts with "RIFF" → base64 prefix "UklGR"
  //   MP3 starts with ID3 or sync bytes → anything else
  function audioDataUrl(b64) {
    const mime = b64 && b64.startsWith('UklGR') ? 'audio/wav' : 'audio/mpeg';
    return `data:${mime};base64,${b64}`;
  }

  // Loads audio src and waits for metadata (with 5s timeout fallback).
  // Calls onDuration(ms) once duration is known.
  function loadAudio(audioEl, src, onDuration) {
    return new Promise((resolve) => {
      const timer = setTimeout(() => {
        console.warn('[TTS] onloadedmetadata timeout — proceeding without duration');
        resolve();
      }, 5000);

      audioEl.onloadedmetadata = () => {
        clearTimeout(timer);
        if (onDuration) onDuration(audioEl.duration * 1000);
        resolve();
      };
      audioEl.onerror = (e) => {
        clearTimeout(timer);
        console.warn('[TTS] Audio element error:', e?.message || e);
        resolve();  // resolve so the alert still shows
      };
      audioEl.src = src;
      audioEl.load();
    });
  }

  // Plays audio — retries once after user interaction if blocked by autoplay policy.
  function playAudio(audioEl) {
    const p = audioEl.play();
    if (p && typeof p.catch === 'function') {
      p.catch(e => {
        console.warn('[TTS] audio.play() blocked:', e.name, '— waiting for user interaction');
        // Wait for next click (unlock) then retry
        document.addEventListener('click', () => {
          audioEl.play().catch(e2 => console.warn('[TTS] retry failed:', e2.message));
        }, { once: true });
      });
    }
  }

  // ── Epic Alert HTML generators ────────────────────────────
  function epicHtml1(s){return`<div class="mt-wrap"><div class="mt-impact"></div><div class="mt-impact2"></div><div class="mt-box"><div class="mt-icon">☄️</div><div class="mt-label">💥 DONATION IMPACT</div><div class="mt-row"><div class="mt-name">${s.n}</div><div class="mt-vs">DONATED</div></div><div class="mt-amt">${s.a}</div>${s.m?`<div class="mt-msg">${s.m}</div>`:''}</div></div>`}
  function epicHtml2(s){return`<div class="lg-wrap"><div class="lg-flash"></div><div class="lg-box"><div class="lg-bolt-top"></div><div class="lg-bolt-bot"></div><div class="lg-bolt-l"></div><div class="lg-bolt-r"></div><div class="lg-bg-glow"></div><div class="lg-content"><div class="lg-icon">⚡</div><div class="lg-text"><div class="lg-label">⚡ LIGHTNING DONATION</div><div class="lg-name">${s.n}</div><div class="lg-amt">${s.a}</div>${s.m?`<div class="lg-msg">${s.m}</div>`:''}</div></div></div></div>`}
  function epicHtml3(s){const sp='<div class="df-spark"></div>'.repeat(8);return`<div class="df-wrap"><div class="df-fire-bar"></div><div class="df-box"><div class="df-glow"></div><div class="df-sparks">${sp}</div><div class="df-main"><div class="df-dragon">🐉</div><div class="df-content"><div class="df-label">🐉 DRAGON DONATION</div><div class="df-name">${s.n}</div><div class="df-amt">${s.a}</div>${s.m?`<div class="df-msg">${s.m}</div>`:''}</div></div></div></div>`}
  function epicHtml4(s){let st='';for(let i=0;i<16;i++){const sz=1+Math.random()*2,x=Math.random()*100,y=Math.random()*100,d=Math.random()*3;st+=`<div class="gn-star" style="width:${sz}px;height:${sz}px;left:${x}%;top:${y}%;animation-delay:${d}s"></div>`}return`<div class="gn-wrap"><div class="gn-nova1"></div><div class="gn-nova2"></div><div class="gn-box"><div class="gn-nebula-bg"></div><div class="gn-stars">${st}</div><div class="gn-content"><div class="gn-planet">🪐</div><div class="gn-text"><div class="gn-label">🌌 COSMIC DONATION</div><div class="gn-name">${s.n}</div><div class="gn-amt">${s.a}</div>${s.m?`<div class="gn-msg">${s.m}</div>`:''}</div></div></div></div>`}
  function epicHtml5(s){let b='';[80,50,100,65,45,90,30,70].forEach(h=>b+=`<div class="cg-bar-item" style="height:${h*.4}px"></div>`);return`<div class="cg-wrap"><div class="cg-box"><div class="cg-scanlines"></div><div class="cg-glitch1"></div><div class="cg-glitch2"></div><div class="cg-top-bar"></div><div class="cg-corner-tl"></div><div class="cg-corner-br"></div><div class="cg-content"><div class="cg-icon">👾</div><div class="cg-text"><div class="cg-label">// DONATION.EXE</div><div class="cg-name">${s.n}</div><div class="cg-amt">${s.a}</div>${s.m?`<div class="cg-msg">${s.m}</div>`:''}</div><div class="cg-bar">${b}</div></div></div></div>`}
  const EPIC_HTML_FNS = [null, epicHtml1, epicHtml2, epicHtml3, epicHtml4, epicHtml5];

  // ── Epic canvas particle engine ───────────────────────────
  function runEpicParticles(canvas, id) {
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth || 580;
    canvas.height = canvas.offsetHeight || 240;
    let pts = [], running = true;
    const cfgs = {
      1:{cols:['#ff6600','#ff3300','#ffaa00','#fff'],sp:()=>({x:canvas.width/2+Math.random()*60-30,y:canvas.height/2,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-Math.random()*4,l:1,d:.015+Math.random()*.02,s:2+Math.random()*5})},
      2:{cols:['#8899ff','#aabbff','#ffffff','#4466ff'],sp:()=>({x:Math.random()*canvas.width,y:0,vx:(Math.random()-.5)*1.5,vy:4+Math.random()*6,l:1,d:.02,s:1+Math.random()*3})},
      3:{cols:['#ff4400','#ff8800','#ffcc00'],sp:()=>({x:40+Math.random()*canvas.width*.3,y:canvas.height,vx:(Math.random()-.5)*3,vy:-(2+Math.random()*5),l:1,d:.018+Math.random()*.015,s:1.5+Math.random()*3.5})},
      4:{cols:['#ff88ff','#aa60ff','#6688ff','#ff44aa'],sp:()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,l:1,d:.008+Math.random()*.01,s:.5+Math.random()*2.5})},
      5:{cols:['#00ff96','#00ffcc','#ffffff','#00ff44'],sp:()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*4,vy:-(1+Math.random()*2),l:1,d:.02+Math.random()*.03,s:.5+Math.random()*2})},
    };
    const cfg = cfgs[id];
    const spawnCount = id === 4 ? 3 : 6;
    (function loop() {
      if (!running) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < spawnCount; i++) pts.push(cfg.sp());
      pts = pts.filter(p => p.l > 0);
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (id <= 3) p.vy += .12;
        p.l -= p.d;
        ctx.globalAlpha = Math.max(0, p.l) * .85;
        ctx.fillStyle = cfg.cols[0 | Math.random() * cfg.cols.length];
        ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      requestAnimationFrame(loop);
    })();
    return () => { running = false; ctx.clearRect(0, 0, canvas.width, canvas.height); };
  }

  // ── Show Epic Alert ───────────────────────────────────────
  async function showEpicAlert(donation) {
    return new Promise(async (resolve) => {
      const container = document.getElementById('epic-alert-container');
      const content   = document.getElementById('epicContent');
      const canvas    = document.getElementById('epicCanvas');

      // Donor's choice overrides config style (unless they also chose "random")
      const donorStyle = donation.epicStyle && donation.epicStyle !== 'random'
        ? donation.epicStyle : null;
      const resolvedStyle = donorStyle || epicAlertConfig.style;
      let styleId = resolvedStyle === 'random'
        ? Math.floor(Math.random() * 5) + 1
        : (parseInt(resolvedStyle) || 1);
      styleId = Math.max(1, Math.min(5, styleId));

      const s = {
        n: donation.name || '?',
        a: `฿${Number(donation.amount).toLocaleString()}`,
        m: donation.message || '',
      };

      content.innerHTML = EPIC_HTML_FNS[styleId](s);
      container.style.display = 'flex';
      const stopFx = runEpicParticles(canvas, styleId);

      // Audio
      const audio = document.getElementById('ttsAudio');
      let audioDuration = 0;
      if (donation.audioBase64) {
        await loadAudio(audio, audioDataUrl(donation.audioBase64),
          (dur) => { audioDuration = dur; });
        playAudio(audio);
      } else {
        console.warn('[TTS] No audioBase64 received — TTS may not be configured or failed');
      }

      // Epic CSS exit animation fires at 4.8s; total = max(5200, audio+1000)
      const totalDuration = Math.max(5200, audioDuration + 1000);
      setTimeout(() => {
        container.style.display = 'none';
        content.innerHTML = '';
        if (stopFx) stopFx();
        resolve();
      }, totalDuration);
    });
  }

  // ── Position map ─────────────────────────────────────────
  const POSITION_STYLES = {
    'top-left':      { top:'20px',  bottom:'auto', left:'20px',  right:'auto', transform:'none' },
    'top-center':    { top:'20px',  bottom:'auto', left:'50%',   right:'auto', transform:'translateX(-50%)' },
    'top-right':     { top:'20px',  bottom:'auto', left:'auto',  right:'20px', transform:'none' },
    'middle-left':   { top:'50%',   bottom:'auto', left:'20px',  right:'auto', transform:'translateY(-50%)' },
    'middle-center': { top:'50%',   bottom:'auto', left:'50%',   right:'auto', transform:'translate(-50%,-50%)' },
    'middle-right':  { top:'50%',   bottom:'auto', left:'auto',  right:'20px', transform:'translateY(-50%)' },
    'bottom-left':   { top:'auto',  bottom:'40px', left:'20px',  right:'auto', transform:'none' },
    'bottom-center': { top:'auto',  bottom:'40px', left:'50%',   right:'auto', transform:'translateX(-50%)' },
    'bottom-right':  { top:'auto',  bottom:'40px', left:'auto',  right:'20px', transform:'none' },
  };

  function applyOverlayPosition(pos) {
    const s = POSITION_STYLES[pos] || POSITION_STYLES['bottom-center'];
    ['alert-container', 'epic-alert-container'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      Object.assign(el.style, s);
    });
  }

  async function loadConfig() {
    try {
      const r   = await fetch('/api/config');
      const cfg = await r.json();
      alertDuration = (cfg.alertDuration || 8) * 1000;
      currentTheme  = cfg.theme || 'purple-galaxy';
      document.body.className = 'theme-' + currentTheme;
      applyOverlayPosition(cfg.overlayPosition || 'bottom-center');

      // Epic alert config
      const ea = cfg.epicAlert || {};
      epicAlertConfig = {
        enabled:   !!ea.enabled,
        minAmount: Number(ea.minAmount) || 50,
        style:     ea.style || 'random',
      };
    } catch(e) {}
  }

  const socket = io();
  socket.on('new_donation', (data) => {
    queue.push(data);
    updateQueueBadge();
    if (!isShowing && !isPaused) processQueue();
  });

  socket.on('queue_pause', () => {
    isPaused = true;
    const ind = document.getElementById('pause-indicator');
    if (ind) ind.style.display = 'flex';
  });

  socket.on('queue_resume', () => {
    isPaused = false;
    const ind = document.getElementById('pause-indicator');
    if (ind) ind.style.display = 'none';
    if (!isShowing) processQueue();
  });

  setInterval(loadConfig, 30000);

  function updateQueueBadge() {
    const badge = document.getElementById('queue-badge');
    if (queue.length > 0) {
      badge.style.display = 'block';
      document.getElementById('queue-count').textContent = queue.length;
    } else {
      badge.style.display = 'none';
    }
  }

  async function processQueue() {
    if (isPaused || queue.length === 0) { isShowing = false; return; }
    isShowing = true;
    const donation = queue.shift();
    updateQueueBadge();
    await showAlert(donation);
    setTimeout(processQueue, 800);
  }

  function pickAnimation() {
    // Avoid repeating same animation twice in a row
    let idx;
    do { idx = Math.floor(Math.random() * ANIM_PAIRS.length); }
    while (idx === lastAnimIdx && ANIM_PAIRS.length > 1);
    lastAnimIdx = idx;
    return ANIM_PAIRS[idx];
  }

  function spawnParticles() {
    const palette = THEME_PARTICLES[currentTheme] || THEME_PARTICLES['purple-galaxy'];
    const container = document.getElementById('particles');
    container.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4 + Math.random() * 9;
      p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${Math.random()*40}%;background:${palette[Math.floor(Math.random()*palette.length)]};animation-delay:${Math.random()*.6}s;animation-duration:${1+Math.random()*1.2}s;`;
      container.appendChild(p);
    }
  }

  function showAnimBadge(label) {
    const el = document.getElementById('anim-badge');
    el.textContent = label;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  async function showAlert(donation) {
    const amount = Number(donation.amount) || 0;
    if (donation.forceEpic || (epicAlertConfig.enabled && amount >= epicAlertConfig.minAmount)) {
      return showEpicAlert(donation);
    }
    return new Promise(async (resolve) => {
      const box = document.getElementById('alertBox');

      // ── Fill content ──────────────────────────────────────
      document.getElementById('alertName').textContent = donation.name;
      document.getElementById('alertAmount').textContent =
        `฿${Number(donation.amount).toLocaleString()} ${donation.currency || 'THB'}`;

      const msgEl = document.getElementById('alertMessage');
      if (donation.message) { msgEl.textContent = donation.message; msgEl.style.display = 'block'; }
      else { msgEl.style.display = 'none'; }

      document.getElementById('alertIcon').textContent = '🎁';

      // TTS pill
      const pill = document.getElementById('alertTtsPill');
      if (donation.ttsProvider) {
        pill.textContent = donation.ttsProvider === 'google' ? '🔵 Google' : '🎧 ElevenLabs';
        pill.style.display = 'inline-flex';
      } else {
        pill.style.display = 'none';
      }

      // ── Pick & apply animation ────────────────────────────
      // Remove all previous anim classes
      box.className = 'alert-box';

      const [enterClass, exitClass, animLabel] = pickAnimation();

      spawnParticles();

      // Force reflow before adding animation class
      void box.offsetWidth;
      box.classList.add(enterClass);
      showAnimBadge(animLabel);

      // ── Audio ─────────────────────────────────────────────
      const audio       = document.getElementById('ttsAudio');
      const speakingEl  = document.getElementById('speakingIndicator');
      let   audioDuration = 0;

      if (donation.audioBase64) {
        await loadAudio(audio, audioDataUrl(donation.audioBase64),
          (dur) => { audioDuration = dur; });
        speakingEl.classList.add('active');
        audio.onended = () => speakingEl.classList.remove('active');
        playAudio(audio);
      } else {
        console.warn('[TTS] No audioBase64 received — TTS may not be configured or failed');
      }

      const totalDuration = Math.max(alertDuration, audioDuration + 1000);

      // ── Progress bar ──────────────────────────────────────
      const bar = document.getElementById('progressBar');
      bar.style.transition = 'none';
      bar.style.transform  = 'scaleX(1)';
      requestAnimationFrame(() => {
        bar.style.transition = `transform ${totalDuration}ms linear`;
        bar.style.transform  = 'scaleX(0)';
      });

      // ── Exit ──────────────────────────────────────────────
      setTimeout(() => {
        box.classList.remove(enterClass);
        void box.offsetWidth;
        box.classList.add(exitClass);
        setTimeout(resolve, 380);
      }, totalDuration);
    });
  }

  loadConfig();

  // ── Audio unlock (Browser Autoplay Policy) ───────────────
  // Browsers block audio.play() until user interacts with the page.
  // Show a small banner; first click anywhere unlocks audio for the session.
  let audioUnlocked = false;

  const unlockBanner = document.createElement('div');
  unlockBanner.id = 'audio-unlock-banner';
  Object.assign(unlockBanner.style, {
    position: 'fixed', bottom: '12px', left: '50%', transform: 'translateX(-50%)',
    background: 'rgba(0,0,0,0.75)', color: '#fff', padding: '8px 18px',
    borderRadius: '20px', fontSize: '13px', cursor: 'pointer',
    zIndex: '9999', backdropFilter: 'blur(6px)', userSelect: 'none',
    border: '1px solid rgba(255,255,255,0.2)', transition: 'opacity .4s',
  });
  unlockBanner.textContent = '🔊 คลิกเพื่อเปิดเสียง';
  document.body.appendChild(unlockBanner);

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    // Play a silent buffer to satisfy browser autoplay policy
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    ctx.close();
    unlockBanner.style.opacity = '0';
    setTimeout(() => unlockBanner.remove(), 500);
  }

  document.addEventListener('click', unlockAudio, { once: false });
  // Auto-attempt after 1s in case OBS allows it (some versions do)
  setTimeout(() => {
    if (!audioUnlocked) {
      const a = new Audio();
      a.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
      a.volume = 0;
      a.play().then(() => { audioUnlocked = true; unlockBanner.style.opacity = '0'; setTimeout(() => unlockBanner.remove(), 500); }).catch(() => {});
    }
  }, 1000);
</script>
</body>
