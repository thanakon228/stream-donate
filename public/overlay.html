<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donation Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    font-family: 'Kanit', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  /* ====== ALERT BOX ====== */
  #alert-container {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 580px;
    pointer-events: none;
    z-index: 100;
  }

  .alert-box {
    background: linear-gradient(135deg, rgba(15,10,30,.97) 0%, rgba(35,24,69,.97) 100%);
    border: 2px solid transparent;
    border-radius: 20px;
    padding: 0;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0,0,0,.6),
      0 0 0 1px rgba(124,58,237,.3),
      inset 0 1px 0 rgba(255,255,255,.08);
    opacity: 0;
    transform: translateY(60px) scale(.9);
    transition: none;
    position: relative;
  }

  .alert-box.show {
    animation: slideUp .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .alert-box.hide {
    animation: slideDown .4s ease-in forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(60px) scale(.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes slideDown {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(60px) scale(.9); }
  }

  /* glow border by emotion */
  .alert-box[data-emotion="happy"]     { box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 30px rgba(251,191,36,.3), 0 0 0 2px rgba(251,191,36,.5); }
  .alert-box[data-emotion="excited"]   { box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(239,68,68,.3), 0 0 0 2px rgba(239,68,68,.6); }
  .alert-box[data-emotion="sad"]       { box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 30px rgba(59,130,246,.3), 0 0 0 2px rgba(59,130,246,.5); }
  .alert-box[data-emotion="angry"]     { box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(220,38,38,.4), 0 0 0 2px rgba(220,38,38,.7); }
  .alert-box[data-emotion="whispering"]{ box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 20px rgba(167,139,250,.2), 0 0 0 2px rgba(167,139,250,.3); }
  .alert-box[data-emotion="neutral"]   { box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 30px rgba(124,58,237,.25), 0 0 0 2px rgba(124,58,237,.4); }

  /* top accent bar */
  .alert-accent {
    height: 4px;
    background: linear-gradient(90deg, #7c3aed, #f59e0b, #7c3aed);
    background-size: 200% 100%;
    animation: shimmer 2s linear infinite;
  }

  .alert-box[data-emotion="happy"]     .alert-accent { background: linear-gradient(90deg, #f59e0b, #fcd34d, #f59e0b); }
  .alert-box[data-emotion="excited"]   .alert-accent { background: linear-gradient(90deg, #ef4444, #f97316, #ef4444); }
  .alert-box[data-emotion="sad"]       .alert-accent { background: linear-gradient(90deg, #3b82f6, #818cf8, #3b82f6); }
  .alert-box[data-emotion="angry"]     .alert-accent { background: linear-gradient(90deg, #dc2626, #b91c1c, #dc2626); }
  .alert-box[data-emotion="whispering"].alert-accent { background: linear-gradient(90deg, #a78bfa, #c4b5fd, #a78bfa); }

  @keyframes shimmer { to { background-position: 200% 0; } }

  .alert-body {
    padding: 18px 22px 20px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .emotion-icon {
    font-size: 44px;
    line-height: 1;
    flex-shrink: 0;
    animation: bounce .6s ease .5s both;
  }

  @keyframes bounce {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.3) rotate(-10deg); }
  }

  .alert-content { flex: 1; min-width: 0; }

  .alert-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .donor-name {
    font-size: 20px;
    font-weight: 800;
    color: #f3f0ff;
    text-shadow: 0 0 20px rgba(124,58,237,.6);
  }

  .donated-text { font-size: 13px; color: #9d8ec4; }

  .amount-badge {
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    border-radius: 20px;
    padding: 3px 14px;
    font-size: 18px;
    font-weight: 700;
    color: white;
    box-shadow: 0 4px 12px rgba(124,58,237,.4);
    white-space: nowrap;
  }

  .alert-box[data-emotion="happy"]     .amount-badge { background: linear-gradient(135deg, #d97706, #f59e0b); }
  .alert-box[data-emotion="excited"]   .amount-badge { background: linear-gradient(135deg, #dc2626, #f97316); }
  .alert-box[data-emotion="sad"]       .amount-badge { background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
  .alert-box[data-emotion="angry"]     .amount-badge { background: linear-gradient(135deg, #991b1b, #dc2626); }
  .alert-box[data-emotion="whispering"].amount-badge { background: linear-gradient(135deg, #4c1d95, #7c3aed); }

  .alert-message {
    font-size: 15px;
    color: #c4b5fd;
    line-height: 1.5;
    background: rgba(124,58,237,.1);
    border-left: 3px solid rgba(124,58,237,.5);
    border-radius: 0 8px 8px 0;
    padding: 8px 12px;
    margin-top: 8px;
  }

  .alert-box[data-emotion="happy"]     .alert-message { border-left-color: rgba(245,158,11,.6); color: #fde68a; background: rgba(245,158,11,.08); }
  .alert-box[data-emotion="excited"]   .alert-message { border-left-color: rgba(239,68,68,.6); color: #fca5a5; background: rgba(239,68,68,.08); }
  .alert-box[data-emotion="sad"]       .alert-message { border-left-color: rgba(59,130,246,.6); color: #93c5fd; background: rgba(59,130,246,.08); }
  .alert-box[data-emotion="angry"]     .alert-message { border-left-color: rgba(220,38,38,.7); color: #fca5a5; background: rgba(220,38,38,.1); }
  .alert-box[data-emotion="whispering"].alert-message { border-left-color: rgba(167,139,250,.4); color: #ddd6fe; background: rgba(167,139,250,.06); font-style: italic; }

  /* progress bar */
  .alert-progress {
    height: 3px;
    background: rgba(255,255,255,.08);
    position: relative;
    overflow: hidden;
  }

  .alert-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #a855f7);
    width: 100%;
    transform-origin: left;
    animation: none;
  }

  /* particles */
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    border-radius: 20px;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: floatUp 1.5s ease-out forwards;
  }

  @keyframes floatUp {
    0%   { opacity: .8; transform: translateY(0) scale(1); }
    100% { opacity: 0;  transform: translateY(-80px) scale(0); }
  }

  /* TTS speaking indicator */
  .speaking-indicator {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 18px;
    margin-left: auto;
    padding-right: 4px;
    opacity: 0;
    transition: opacity .3s;
  }

  .speaking-indicator.active { opacity: 1; }
  .speaking-indicator span {
    width: 3px;
    background: #a78bfa;
    border-radius: 2px;
    animation: wave 1s ease-in-out infinite;
  }
  .speaking-indicator span:nth-child(1) { animation-delay: 0s;    height: 6px; }
  .speaking-indicator span:nth-child(2) { animation-delay: .1s;   height: 12px; }
  .speaking-indicator span:nth-child(3) { animation-delay: .2s;   height: 16px; }
  .speaking-indicator span:nth-child(4) { animation-delay: .3s;   height: 10px; }
  .speaking-indicator span:nth-child(5) { animation-delay: .15s;  height: 8px; }
  @keyframes wave {
    0%,100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.8); }
  }

  /* queue indicator */
  #queue-badge {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(124,58,237,.8);
    color: white;
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    backdrop-filter: blur(10px);
  }
</style>
</head>
<body>

<div id="queue-badge">รอ: <span id="queue-count">0</span></div>

<div id="alert-container">
  <div class="alert-box" id="alertBox">
    <div class="alert-accent"></div>
    <div class="particles" id="particles"></div>
    <div class="alert-body">
      <div class="emotion-icon" id="alertIcon">🎁</div>
      <div class="alert-content">
        <div class="alert-header">
          <span class="donor-name" id="alertName">ชื่อผู้บริจาค</span>
          <span class="donated-text">บริจาค</span>
          <span class="amount-badge" id="alertAmount">฿100</span>
          <div class="speaking-indicator" id="speakingIndicator">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="alert-message" id="alertMessage">ข้อความจากผู้บริจาค</div>
      </div>
    </div>
    <div class="alert-progress"><div class="alert-progress-bar" id="progressBar"></div></div>
  </div>
</div>

<audio id="ttsAudio"></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
  const EMOTIONS = {
    neutral:    { icon: '🎁',  label: 'ปกติ' },
    happy:      { icon: '🎉',  label: 'มีความสุข' },
    excited:    { icon: '🔥',  label: 'ตื่นเต้น' },
    sad:        { icon: '💙',  label: 'เศร้า' },
    angry:      { icon: '💢',  label: 'โกรธ' },
    whispering: { icon: '🤫',  label: 'กระซิบ' },
  };

  let queue = [];
  let isShowing = false;
  let alertDuration = 8000;

  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      const cfg = await r.json();
      alertDuration = (cfg.alertDuration || 8) * 1000;
    } catch(e) {}
  }

  const socket = io();
  socket.on('new_donation', (data) => {
    queue.push(data);
    updateQueueBadge();
    if (!isShowing) processQueue();
  });

  function updateQueueBadge() {
    const badge = document.getElementById('queue-badge');
    if (queue.length > 0) {
      badge.style.display = 'block';
      document.getElementById('queue-count').textContent = queue.length;
    } else {
      badge.style.display = 'none';
    }
  }

  async function processQueue() {
    if (queue.length === 0) { isShowing = false; return; }
    isShowing = true;
    const donation = queue.shift();
    updateQueueBadge();
    await showAlert(donation);
    setTimeout(processQueue, 800);
  }

  function spawnParticles(emotion) {
    const colors = {
      happy:      ['#fcd34d','#fbbf24','#f59e0b'],
      excited:    ['#f97316','#ef4444','#fbbf24'],
      sad:        ['#93c5fd','#60a5fa','#818cf8'],
      angry:      ['#ef4444','#dc2626','#f97316'],
      whispering: ['#c4b5fd','#a78bfa','#818cf8'],
      neutral:    ['#a78bfa','#c4b5fd','#7c3aed'],
    };
    const palette = colors[emotion] || colors.neutral;
    const container = document.getElementById('particles');
    container.innerHTML = '';

    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 4 + Math.random() * 8;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        bottom:${Math.random()*40}%;
        background:${palette[Math.floor(Math.random()*palette.length)]};
        animation-delay:${Math.random()*.5}s;
        animation-duration:${1+Math.random()}s;
      `;
      container.appendChild(p);
    }
  }

  async function showAlert(donation) {
    return new Promise(async (resolve) => {
      const box = document.getElementById('alertBox');
      const emotion = donation.emotion || 'neutral';
      const eData = EMOTIONS[emotion] || EMOTIONS.neutral;

      // set content
      document.getElementById('alertName').textContent = donation.name;
      document.getElementById('alertAmount').textContent =
        `฿${Number(donation.amount).toLocaleString()} ${donation.currency || 'THB'}`;
      const msgEl = document.getElementById('alertMessage');
      if (donation.message) {
        msgEl.textContent = donation.message;
        msgEl.style.display = 'block';
      } else {
        msgEl.style.display = 'none';
      }
      document.getElementById('alertIcon').textContent = eData.icon;
      box.dataset.emotion = emotion;

      spawnParticles(emotion);

      // show
      box.classList.remove('hide');
      box.classList.add('show');

      // audio
      const audio = document.getElementById('ttsAudio');
      const speakingEl = document.getElementById('speakingIndicator');
      let audioDuration = 0;

      if (donation.audioBase64) {
        audio.src = 'data:audio/mpeg;base64,' + donation.audioBase64;
        await new Promise(r => {
          audio.onloadedmetadata = () => { audioDuration = audio.duration * 1000; r(); };
          audio.onerror = r;
          audio.load();
        });
        speakingEl.classList.add('active');
        audio.play().catch(() => {});
        audio.onended = () => speakingEl.classList.remove('active');
      }

      const totalDuration = Math.max(alertDuration, audioDuration + 1000);

      // progress bar
      const bar = document.getElementById('progressBar');
      bar.style.transition = 'none';
      bar.style.transform = 'scaleX(1)';
      requestAnimationFrame(() => {
        bar.style.transition = `transform ${totalDuration}ms linear`;
        bar.style.transform = 'scaleX(0)';
      });

      setTimeout(() => {
        box.classList.remove('show');
        box.classList.add('hide');
        setTimeout(resolve, 400);
      }, totalDuration);
    });
  }

  loadConfig();
</script>
</body>
</html>
